name: FORMA ELAN static site checks

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check static website and public assets
        run: node scripts/check-site.mjs
      - name: Test deterministic construction estimator
        run: node --test tests/construction-estimator.test.mjs
      - name: Test backend request validation
        run: node --test tests/backend-validation.test.mjs
