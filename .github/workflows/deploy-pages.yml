name: Deploy FORMA ELAN to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check site before deployment
        run: node scripts/check-site.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble public website files only
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html management-prototype.html construction-estimator.html _site/
          mkdir -p _site/src
          cp src/construction-estimator.mjs _site/src/
          if [ -d assets ]; then cp -R assets _site/assets; fi
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke-test deployed public URLs
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 10 --retry-all-errors --retry-delay 5 "$PAGE_URL" -o /tmp/forma-home.html
          grep -q 'Forma Elan Companion' /tmp/forma-home.html
          curl --fail --silent --show-error --location --retry 10 --retry-all-errors --retry-delay 5 "${PAGE_URL%/}/management-prototype.html" -o /tmp/forma-management.html
          grep -qi 'Prototype' /tmp/forma-management.html
          curl --fail --silent --show-error --location --retry 10 --retry-all-errors --retry-delay 5 "${PAGE_URL%/}/construction-estimator.html" -o /tmp/forma-estimator.html
          grep -qi 'Estimator RAB / BOQ' /tmp/forma-estimator.html
          echo "Public homepage, management prototype, and estimator preview returned expected content."
