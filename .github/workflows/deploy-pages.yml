name: Deploy FORMA ELAN to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check site before deployment
        run: node scripts/check-site.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble public website files only
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html management-prototype.html _site/
          if [ -d assets ]; then cp -R assets _site/assets; fi
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
